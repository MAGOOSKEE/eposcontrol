name: Build installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EposControl-Setup
          path: dist/EposControl-Setup-*.exe
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: EposControl ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/EposControl-Setup-*.exe
