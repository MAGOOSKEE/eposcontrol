<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <!-- Stand-in artwork modelled on the front view of the GSX 300. Replace with a photo
       (assets/gsx300.png) and keep Art.knob-fx / Art.knob-fy in main.slint in sync. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232427"/>
      <stop offset="0.25" stop-color="#17181a"/>
      <stop offset="1" stop-color="#111214"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34363a"/>
      <stop offset="1" stop-color="#1f2023"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#2c2d31"/>
      <stop offset="1" stop-color="#111214"/>
    </radialGradient>
  </defs>
  <rect x="40" y="40" width="560" height="300" rx="26" fill="url(#bezel)"/>
  <rect x="46" y="62" width="548" height="272" rx="22" fill="url(#face)"/>
  <circle cx="460" cy="212" r="112" fill="#0c0d0f"/>
  <circle cx="460" cy="212" r="102" fill="url(#knob)"/>
  <circle cx="460" cy="212" r="102" fill="none" stroke="#2b2d31" stroke-width="2"/>
  <rect x="456" y="124" width="8" height="30" rx="4" fill="#4a4d54"/>
  <circle cx="290" cy="296" r="26" fill="#17181a" stroke="#2a2c30" stroke-width="2"/>
  <circle cx="290" cy="296" r="22" fill="#1b1c1f"/>
  <g fill="#8d9199">
    <rect x="72" y="92" width="30" height="7" rx="3.5"/>
    <rect x="66" y="104" width="30" height="7" rx="3.5"/>
    <rect x="72" y="116" width="30" height="7" rx="3.5"/>
  </g>
</svg>
