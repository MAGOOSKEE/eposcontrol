[package]
name = "eposcontrol"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
epos-device = { path = "../epos-device" }
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
tray-icon = { version = "0.21", default-features = false }
auto-launch = "0.5"
single-instance = "0.3"

[build-dependencies]
slint-build = "1"
